<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noema companion preview</title><link rel="stylesheet" href="/static/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#101110}.companion-wrap{padding:14px;max-width:250px;text-align:center}.cat-toggle{padding:6px;border-radius:9px;line-height:0}.cat-toggle img{image-rendering:pixelated;filter:drop-shadow(0 0 1px #b6c299)}#compact-list{margin:9px 0;text-align:left}#compact-list button{display:block;font-size:11px;color:var(--dim);padding:6px 5px;width:100%;text-align:left;border-bottom:1px solid var(--line)}.preview-label{font-size:10px;color:var(--muted);margin-top:10px}.companion-controls{display:flex;justify-content:center;gap:7px;margin-top:12px}.dot-mode{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%}</style></head><body><main class="companion-wrap"><button id="pet" class="cat-toggle" aria-label="Show suggested tasks"><img src="/static/cat.png" width="40" alt="Little cat"></button><div id="compact-list" hidden></div><div id="context-label" class="small muted"></div><div class="companion-controls"><button id="mode" class="quiet-button small">Dot mode</button><button id="open" class="quiet-button small">Open Noema</button></div><p class="preview-label">Browser preview · not an always-on-top desktop overlay</p></main><script src="/static/companion.js" type="module"></script></body></html>
