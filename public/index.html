<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101110"><meta name="description" content="Learning notes and a quieter place for your attention.">
<title>Noema</title><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>
<div class="app-shell">
<aside class="sidebar" aria-label="Main navigation">
<a class="wordmark" href="#overview"><span class="brand-mark">n.</span>Noema</a>
<nav id="nav">
<a href="#overview" data-page="overview"><span class="nav-icon">◉</span><span>Now</span></a>
<a href="#capture" data-page="capture"><span class="nav-icon">＋</span><span>Capture</span></a>
<a href="#notes" data-page="notes"><span class="nav-icon">▤</span><span>Notes</span></a>
<a href="#plan" data-page="plan"><span class="nav-icon">≡</span><span>Plan</span></a>
</nav>
<div class="sidebar-bottom"><button data-action="settings" class="nav-button"><span class="nav-icon">⚙</span> Settings</button><div class="local-label"><span class="status-dot"></span><span id="connection-label">Connecting</span></div></div>
</aside>
<div class="workspace">
<header class="topbar"><span id="breadcrumb">Your workspace</span><div class="topbar-right"><span id="status-summary" class="muted"></span><button data-action="search" class="icon-button" aria-label="Search notes">⌕</button><button data-action="capture" class="quiet-button">Capture <kbd>N</kbd></button></div></header>
<main id="view" tabindex="-1" aria-live="off"><p class="muted">Opening your workspace…</p></main>
</div>
</div>
<button id="companion-launch" data-action="companion" aria-label="Open companion preview" title="Companion preview; native Sway helper is separate"><img src="/static/cat.png" alt="" width="36" height="34"></button>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<script src="/static/app.js" type="module"></script>
</body></html>
