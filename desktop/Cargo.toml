[package]
name = "noema-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["webview"]
webview = ["dep:wry", "dep:tao", "dep:webbrowser", "dep:gtk"]
qa = ["webview"]

[dependencies]
url = "2"
fs2 = "0.4"
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
webbrowser = { version = "1", optional = true }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
